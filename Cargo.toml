[workspace]
resolver = "2"
members = ["crates/protocol", "crates/engine", "crates/arena", "crates/server", "crates/cli", "crates/trainer", "sdk/rust"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hexarena-protocol = { path = "crates/protocol" }
hexarena-engine = { path = "crates/engine" }
hexarena-sdk = { path = "sdk/rust" }
hexarena-arena = { path = "crates/arena" }
